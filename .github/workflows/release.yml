name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Get version
      id: version
      run: |
        # Full tag (e.g. v1.0.5) for release assets and Homebrew.
        TAG=${GITHUB_REF#refs/tags/}
        echo "TAG=${TAG}" >> $GITHUB_OUTPUT
        # Version without the leading "v" so it matches cmd.Version and what
        # `homegit version` reports (e.g. 1.0.5).
        echo "VERSION=${TAG#v}" >> $GITHUB_OUTPUT

    - name: Build binaries
      run: |
        # macOS AMD64
        GOOS=darwin GOARCH=amd64 go build -o homegit-darwin-amd64 -ldflags "-X main.version=${{ steps.version.outputs.VERSION }}"
        
        # macOS ARM64
        GOOS=darwin GOARCH=arm64 go build -o homegit-darwin-arm64 -ldflags "-X main.version=${{ steps.version.outputs.VERSION }}"
        
        # Linux AMD64
        GOOS=linux GOARCH=amd64 go build -o homegit-linux-amd64 -ldflags "-X main.version=${{ steps.version.outputs.VERSION }}"
        
        # Linux ARM64
        GOOS=linux GOARCH=arm64 go build -o homegit-linux-arm64 -ldflags "-X main.version=${{ steps.version.outputs.VERSION }}"
        
        # Windows AMD64
        GOOS=windows GOARCH=amd64 go build -o homegit-windows-amd64.exe -ldflags "-X main.version=${{ steps.version.outputs.VERSION }}"

    - name: Create checksums
      run: |
        sha256sum homegit-* > checksums.txt

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          homegit-darwin-amd64
          homegit-darwin-arm64
          homegit-linux-amd64
          homegit-linux-arm64
          homegit-windows-amd64.exe
          checksums.txt
        body_path: docs/CHANGELOG.md
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  homebrew:
    name: Update Homebrew tap
    needs: release
    runs-on: ubuntu-latest
    steps:
    - name: Get version
      id: version
      run: |
        TAG=${GITHUB_REF#refs/tags/}
        echo "TAG=${TAG}" >> $GITHUB_OUTPUT

    - name: Verify tap token is configured
      env:
        HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      run: |
        if [ -z "${HOMEBREW_TAP_TOKEN}" ]; then
          echo "::error::HOMEBREW_TAP_TOKEN secret is not set. The GitHub release"
          echo "::error::was published successfully, but the Homebrew tap was not"
          echo "::error::updated. Add a token with write access to"
          echo "::error::chris-roerig/homebrew-homegit, then re-run this job:"
          echo "::error::  gh run rerun <run-id> --failed"
          exit 1
        fi

    - name: Update formula
      env:
        HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      run: |
        TAG=${{ steps.version.outputs.TAG }}
        echo "Calculating SHA256 for Homebrew formula..."
        sleep 5  # Wait for release tarball to be available
        SHA=$(curl -sL https://github.com/chris-roerig/homegit/archive/refs/tags/${TAG}.tar.gz | shasum -a 256 | cut -d' ' -f1)
        echo "SHA256: $SHA"

        # Clone homebrew tap using the token so the push is authenticated.
        git clone https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/chris-roerig/homebrew-homegit.git tap
        cd tap

        # Update formula
        sed -i "s|archive/refs/tags/v[0-9.]*\.tar\.gz|archive/refs/tags/${TAG}.tar.gz|g" Formula/homegit.rb
        sed -i "s/sha256 \"[a-f0-9]*\"/sha256 \"$SHA\"/g" Formula/homegit.rb

        # Commit and push (no-op exit if nothing changed)
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add Formula/homegit.rb
        if git diff --cached --quiet; then
          echo "Formula already up to date for ${TAG}; nothing to push."
          exit 0
        fi
        git commit -m "Update homegit to ${TAG}"
        git push origin main
